name: london_range_breakout_volatility_indices
symbols: ["Volatility 25 (1s) Index", "Volatility 50 (1s) Index", "Volatility 100 (1s) Index"]
timeframe: M15
status: proposed        # proposed | approved | active | retired
author: human           # human | agent
enabled: true

filters:
  # No real regional trading session applies to a 24/7 synthetic index —
  # this just bounds *when* the strategy is allowed to fire, kept at the
  # same 08:00-16:00 UTC window the original "london" session covered.
  # Tune or drop it; it isn't backed by any liquidity mechanism here.
  - type: time_of_day
    start_hour: 8
    end_hour: 16
  - type: volatility_regime
    operator: in
    value: [normal, high]
  # Synthetic-index analog of news_blackout: there's no macro calendar to
  # sit out on a synthetic instrument, but an outsized single bar is the
  # same kind of shock a news blackout exists to avoid trading into.
  - type: volatility_spike_guard
    atr_key: atr_14
    multiple: 3.0

entry:
  conditions:
    - type: price_breaks
      reference: asian_session_high
      confirmation: close
    - type: indicator_comparison
      left: atr_14
      operator: '>'
      right: atr_14_median_20

exit:
  stop_loss:
    type: atr_multiple
    multiple: 1.5
  take_profit:
    type: r_multiple
    multiple: 2.0
  time_stop:
    bars: 32

risk:
  risk_per_trade_pct: 0.5
  max_concurrent: 2
