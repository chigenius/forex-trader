[project]
name = "forexml"
version = "0.1.0"
description = "Forex strategy research & execution framework — Phase 1 foundation layer"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]
mt5 = [
    "MetaTrader5>=5.0.45",
]

[project.scripts]
forexml = "forexml.cli.main:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forexml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
